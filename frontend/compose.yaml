services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    init: true
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  app_node_modules:
  app_next:
